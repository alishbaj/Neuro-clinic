name: Publish to gh-pages

# Pages is configured as: Settings -> Pages -> Source -> Deploy from a branch -> gh-pages / (root)
# This rebuilds from src/ and force-pushes the built site to that branch.
#
# Needs: Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the site
        run: python3 build.py

      - name: Fail on broken links, missing assets or bad ARIA wiring
        run: python3 tools/check.py

      - name: Publish the built site to gh-pages
        run: |
          set -euo pipefail
          rm -rf .publish && mkdir .publish
          cp -R assets favicon.png .publish/
          cp ./*.html sitemap.xml robots.txt site.webmanifest .publish/
          touch .publish/.nojekyll

          cd .publish
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
